[package]
name = "dio-rust-carteira-investimentos"
version = "0.1.0"
edition = "2021"
authors = ["Rafael Sales <RafaelSalesBR>"]
description = "Carteira digital de investimentos em Rust baseada no bootcamp Santander 2026 - Rust AI Developer"
license = "MIT"

[dependencies]
askama = "0.12"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
